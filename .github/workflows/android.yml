name: Android-APK bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Gradle-Wrapper ausführbar machen
        run: chmod +x gradlew

      - name: Unit-Tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: APK bauen
        run: ./gradlew --no-daemon assembleDebug

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk FA-PDF-Test.apk

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: FA-PDF-Test
          path: FA-PDF-Test.apk

      - name: Als Release mit direktem Download-Link veröffentlichen
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-apk --yes --cleanup-tag || true
          gh release create test-apk FA-PDF-Test.apk \
            --title "FA PDF – Test-APK" \
            --notes "Automatisch gebaut aus Commit ${GITHUB_SHA::7}. Debug-signiert, nur zum Testen." \
            --prerelease

      - name: Testberichte bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Testberichte
          path: app/build/reports/tests/
