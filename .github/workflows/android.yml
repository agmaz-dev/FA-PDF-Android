name: Android-APK bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Gradle-Wrapper ausführbar machen
        run: chmod +x gradlew

      - name: Unit-Tests
        shell: bash
        run: set -o pipefail; ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee test.log

      - name: APK bauen
        shell: bash
        run: set -o pipefail; ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log

      - name: Build-Protokoll bei Fehler veröffentlichen
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat test.log build.log 2>/dev/null | grep -E "^e: |error:|FAILED|What went wrong|Unresolved|Exception" | head -300 > fehler.txt || true
          cat test.log build.log > build-protokoll.txt 2>/dev/null || true
          gh release delete build-log --yes --cleanup-tag || true
          gh release create build-log fehler.txt build-protokoll.txt --title "Letztes fehlgeschlagenes Build-Protokoll" --notes "Commit ${GITHUB_SHA::7}" --prerelease

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk FA-PDF-Test.apk

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: FA-PDF-Test
          path: FA-PDF-Test.apk

      - name: Als Release mit direktem Download-Link veröffentlichen
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-apk --yes --cleanup-tag || true
          # Alte (ggf. hängengebliebene) Entwürfe entfernen
          gh release list --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName' | while read t; do gh release delete "$t" --yes || true; done
          sleep 5
          gh release create test-apk FA-PDF-Test.apk \
            --target "$GITHUB_SHA" \
            --title "FA PDF – Test-APK" \
            --notes "Automatisch gebaut aus Commit ${GITHUB_SHA::7}. Debug-signiert, nur zum Testen." \
            --prerelease
          # Sicherstellen, dass die Veröffentlichung kein Entwurf bleibt
          gh release edit test-apk --draft=false --prerelease
          gh release view test-apk --json isDraft,assets --jq '{draft: .isDraft, assets: [.assets[].name]}'

      - name: Testberichte bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Testberichte
          path: app/build/reports/tests/
