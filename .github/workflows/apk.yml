name: TaxiL150 APK bauen (unsigniert)
on:
  push:
    branches: [taxil150]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: APK bauen und Tests ausführen
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          unset TAXI_SIGNING_KEYSTORE
          bash build-manual.sh 2>&1 | tee build-log.txt
          bt="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          mkdir -p /tmp/out
          cp build/aligned.apk /tmp/out/TaxiL150_1.6.9_unsigniert.apk
          cp "$bt/lib/apksigner.jar" /tmp/out/apksigner.jar
          "$bt/aapt" dump badging build/aligned.apk > /tmp/out/badging.txt
          cp build-log.txt /tmp/out/
          echo "${GITHUB_SHA}" > /tmp/out/source-commit.txt
      - name: Ergebnis in Zweig taxil150-out ablegen
        run: |
          cd /tmp/out
          git init -q -b taxil150-out
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" taxil150-out
