name: Kuran APK bauen

on:
  workflow_dispatch:
  push:
    branches: [ kuran ]
    paths-ignore: [ 'webapp/**', 'webapp-tools/**', '.github/workflows/webapp.yml' ]

permissions:
  contents: write

jobs:
  build:
    if: github.ref == 'refs/heads/kuran'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kur'an metni, mealler ve yazı tipleri indir
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/prepare_data.py 2>&1 | tee data.log; exit ${PIPESTATUS[0]}

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log

      - name: Fehlerprotokoll im Branch kuran-log ablegen
        if: failure()
        run: |
          mkdir -p /tmp/logs
          cp data.log build.log /tmp/logs/ 2>/dev/null || true
          grep -E "^e: |error:|What went wrong" -A 3 build.log | head -150 > /tmp/logs/errors.txt || true
          cd /tmp/logs
          git init -q -b kuran-log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Build-Log"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" kuran-log

      - name: APK als Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Kuran-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: APK im Branch ablegen (direkter Download)
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/Kuran-Kerim.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/Kuran-Kerim.apk
          git commit -m "APK aktualisiert [skip ci]" || exit 0
          git push

      - name: Signier-Werkzeuge bereitstellen (apksigner, zipalign)
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          mkdir -p /tmp/tools && cp $BT/lib/apksigner.jar $BT/zipalign /tmp/tools/ && (cp -r $BT/lib64 /tmp/tools/ 2>/dev/null || true)
          cd /tmp/tools && git init -q -b kuran-tools && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Build-Tools" && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" kuran-tools
