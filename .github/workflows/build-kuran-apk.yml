name: Kuran APK bauen

on:
  workflow_dispatch:
  push:
    branches: [ kuran ]

permissions:
  contents: write

jobs:
  build:
    if: github.ref == 'refs/heads/kuran'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kur'an metni, mealler ve yazı tipleri indir
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/prepare_data.py

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: APK als Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Kuran-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: APK im Branch ablegen (direkter Download)
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/Kuran-Kerim.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/Kuran-Kerim.apk
          git commit -m "APK aktualisiert [skip ci]" || exit 0
          git push
