name: cleanup temp branches
on:
  push:
    branches: [ dib-fetch ]
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - run: |
          git init -q x && cd x
          for b in dib-data dib-fetch; do git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" --delete $b || true; done
