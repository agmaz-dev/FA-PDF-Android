name: DIB meal fetch
on:
  push:
    branches: [ dib-fetch ]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        run: |
          mkdir out
          curl -sSL -A "Mozilla/5.0" -o out/kuran_meal.pdf "https://webdosya.diyanet.gov.tr/kuran/kuranikerim/dosyalar/document/kuran_meal.pdf" || true
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: dib
          path: out/
          retention-days: 1
