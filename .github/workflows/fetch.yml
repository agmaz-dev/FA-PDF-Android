name: tmp fonts
on:
  push:
    branches: [ dib-fetch ]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; cd out; B=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -sSLf -o SourceSerif4.ttf "$B/sourceserif4/SourceSerif4%5Bopsz,wght%5D.ttf"
          curl -sSLf -o Literata.ttf "$B/literata/Literata%5Bopsz,wght%5D.ttf"
          curl -sSLf -o Newsreader.ttf "$B/newsreader/Newsreader%5Bopsz,wght%5D.ttf"
          ls -la
          git init -q -b dib-data; git config user.name b; git config user.email b@b; git add -A; git commit -qm d; git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dib-data
