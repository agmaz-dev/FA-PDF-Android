name: tmp cors
on:
  push:
    branches: [ dib-fetch ]
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; O="Origin: https://agmaz-dev.github.io"
          for u in https://everyayah.com/data/Alafasy_128kbps/001001.mp3 https://archive.org/download/ishak_danish/112.mp3 "https://archive.org/download/fatihcollakk/112.mp3"; do
            echo "== $u" >> out/cors.txt; curl -sSIL -H "$O" "$u" | grep -iE "^HTTP|access-control|location|content-type|accept-ranges" >> out/cors.txt; done
          cat out/cors.txt
          cd out; git init -q -b dib-data; git config user.name b; git config user.email b@b; git add -A; git commit -qm d; git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dib-data
