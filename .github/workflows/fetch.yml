name: tmp fetch
on:
  push:
    branches: [ dib-fetch ]
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          for id in ishak_danish ishakdanishatimmp3; do curl -sSL "https://archive.org/metadata/$id" -o meta_$id.json; done
          curl -sSL "https://api.quran.com/api/v4/resources/chapter_reciters" -o qc_reciters.json
          curl -sSL "https://archive.org/download/ishakdanishatimmp3" -o ia_danis_dl.html
          ls -la
          git init -q -b dib-data; git config user.name b; git config user.email b@b
          git add -A && git commit -qm d && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dib-data
