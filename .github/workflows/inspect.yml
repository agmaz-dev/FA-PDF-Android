name: Bibliothek pruefen
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Untersuchen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          B=https://dl.google.com/android/maven2/com/google/ai/edge/litertlm/litertlm-android
          curl -sSL $B/maven-metadata.xml > meta.xml
          for V in $(grep -o '<version>[^<]*' meta.xml | sed 's/<version>//'); do
            echo "== $V $(curl -sSL $B/$V/litertlm-android-$V.pom | tr -d '\n ' | grep -o 'kotlin-[a-z]*</artifactId><version>[^<]*' | head -2 | tr '\n' ' ')" >> out.txt
          done
          curl -sSL "https://api.github.com/repos/google-ai-edge/LiteRT-LM/releases?per_page=40" | python3 -c "import sys,json;[print(r['tag_name'],r['published_at'],(r['body'] or '')[:300].replace(chr(10),' ')) for r in json.load(sys.stdin)]" >> out.txt 2>&1
          gh release delete inspect-out -R ${{ github.repository }} --yes --cleanup-tag || true
          sleep 3
          gh release create inspect-out out.txt -R ${{ github.repository }} --title inspect --notes x --prerelease
