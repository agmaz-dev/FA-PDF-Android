name: Bibliothek pruefen
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Untersuchen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          for r in Qwen3.5-0.8B Qwen3.5-2B Qwen3.5-4B; do
            echo "=================== $r" >> out.txt
            curl -sSL "https://huggingface.co/litert-community/$r/raw/main/README.md" | grep -v "^\s*$" | head -150 >> out.txt
            curl -sSL "https://huggingface.co/api/models/litert-community/$r" | python3 -c "import sys,json;d=json.load(sys.stdin);print('created',d.get('createdAt'),'modified',d.get('lastModified'))" >> out.txt
          done
          gh release delete inspect-out -R ${{ github.repository }} --yes --cleanup-tag || true
          sleep 3
          gh release create inspect-out out.txt -R ${{ github.repository }} --title inspect --notes x --prerelease
