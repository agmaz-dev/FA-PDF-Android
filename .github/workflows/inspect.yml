name: Bibliothek pruefen
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Untersuchen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          for q in "litert-community qwen" "qwen3.5 litertlm" "Qwen3.5-0.8B litert" "Qwen3.5-2B litert" "Qwen3.5-4B litert"; do
            echo "== search: $q" >> out.txt
            curl -sSL "https://huggingface.co/api/models?search=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q")&limit=40" | python3 -c "import sys,json;[print(m['id'], m.get('downloads')) for m in json.load(sys.stdin)]" >> out.txt 2>&1
          done
          for r in litert-community/Qwen3.5-0.8B litert-community/Qwen3.5-2B litert-community/Qwen3.5-4B; do
            echo "== $r" >> out.txt
            curl -sSL "https://huggingface.co/api/models/$r?blobs=true" | python3 -c "import sys,json;d=json.load(sys.stdin);print('gated',d.get('gated'));[print(s['rfilename'],s.get('size')) for s in d.get('siblings',[])]" >> out.txt 2>&1
          done
          gh release delete inspect-out -R ${{ github.repository }} --yes --cleanup-tag || true
          sleep 3
          gh release create inspect-out out.txt -R ${{ github.repository }} --title inspect --notes x --prerelease
